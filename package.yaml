name:                hylo
version:             0.1.0.0
github:              "tusharad/hylo"
license:             MIT
author:              "Tushar Adhatrao"
maintainer:          "tusharadhatrao@gmail.com"
copyright:           "2026 Tushar Adhatrao"

extra-doc-files:
- README.md
- CHANGELOG.md

synopsis:            Type-safe Haskell ORM using recursion schemes
category:            Database

description:         Please see the README on GitHub at <https://github.com/tusharad/hylo#readme>

dependencies:
- base >= 4.7 && < 5
- text >= 1.2 && < 3
- bytestring >= 0.10 && < 0.13
- deepseq >= 1.4 && < 2
- time >= 1.9 && < 2
- stm >= 2.5 && < 3
- vector >= 0.12 && < 0.14
- aeson >= 2.0 && < 3
- aeson-qq >= 0.8 && < 1
- scientific >= 0.3 && < 0.4
- template-haskell >= 2.16 && < 3
- containers >= 0.6 && < 0.8

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  hylo-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hylo

tests:
  hylo-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hylo
    - hspec >= 2.11
    - QuickCheck >= 2.14
    - should-not-typecheck >= 2.1
    - deepseq >= 1.4
