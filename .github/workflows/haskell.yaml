name: Haskell CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/run-fourmolu@v11
        with:
          version: "0.17.0.0"
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs
            Setup.hs

  hlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Set up HLint'
        uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'

      - name: 'Run HLint'
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["src", "app", "test"]'
          fail-on: warning

  build-and-test:
    needs: [format, hlint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17", "18"]

    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hylo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hylo_test
      HYLO_TEST_PG_VERSION: ${{ matrix.pg }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client libraries
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install dependencies, build, and run test suite
        uses: freckle/stack-action@v5
